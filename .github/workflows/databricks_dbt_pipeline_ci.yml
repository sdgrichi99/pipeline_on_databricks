name: Databricks dbt CI Pipeline

on:
  pull_request:
    branches:
      - release
      - "release/*"
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dbt-ci-build:
    name: Run dbt CI Validation
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DBT_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Blocco di sicurezza: massimo una PR aperta verso main
      - name: Ensure single active PR to main
        if: github.base_ref == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN_PRS=$(gh pr list --base main --state open --json number --jq 'length')
          echo "Numero di PR aperte verso main: $OPEN_PRS"
          if [ "$OPEN_PRS" -gt 1 ]; then
            echo "::error::Esiste già una Pull Request aperta verso 'main'. È consentita una sola PR verso main alla volta."
            exit 1
          fi

      # Validazione regole di branching
      - name: Validate Source and Target Branches
        run: |
          SRC_BRANCH="${{ github.head_ref }}"
          TARGET_BRANCH="${{ github.base_ref }}"

          echo "Apertura PR da '$SRC_BRANCH' verso '$TARGET_BRANCH'"

          if [[ "$TARGET_BRANCH" =~ ^release ]]; then
            if [[ ! "$SRC_BRANCH" =~ ^dev- && ! "$SRC_BRANCH" =~ ^feature/ && "$SRC_BRANCH" != "dev" ]]; then
              echo "::error::In 'release' può entrare solo un branch 'dev-*' o 'feature/'"
              exit 1
            fi
          fi

          if [[ "$TARGET_BRANCH" == "main" ]]; then
            if [[ ! "$SRC_BRANCH" =~ ^release ]]; then
              echo "::error::In 'main' può entrare solo un branch 'release'"
              exit 1
            fi
          fi

      # Controllo allineamento dei branch rispetto a target e main
      - name: Check branch sync status
        run: |
          git fetch origin main ${{ github.base_ref }} --depth=100 || git fetch origin
          SRC_SHA="${{ github.event.pull_request.head.sha }}"
          SRC_BRANCH="${{ github.head_ref }}"
          TARGET_BRANCH="${{ github.base_ref }}"

          ERRORS=0
          BEHIND_TARGET=$(git rev-list --count $SRC_SHA..origin/$TARGET_BRANCH)
          if [ "$BEHIND_TARGET" -gt 0 ]; then
            echo "::error::Il branch sorgente '$SRC_BRANCH' è indietro di $BEHIND_TARGET commit rispetto al target '$TARGET_BRANCH'"
            ERRORS=$((ERRORS + 1))
          fi

          if [ "$TARGET_BRANCH" != "main" ]; then
            TARGET_BEHIND_MAIN=$(git rev-list --count origin/$TARGET_BRANCH..origin/main)
            if [ "$TARGET_BEHIND_MAIN" -gt 0 ]; then
              echo "::error::Il branch target '$TARGET_BRANCH' è indietro di $TARGET_BEHIND_MAIN commit rispetto a 'main'"
              ERRORS=$((ERRORS + 1))
            fi
          fi

          if [ "$ERRORS" -gt 0 ]; then
            exit 1
          fi

      # Controllo presenza file yml per ogni modello sql
      - name: Check YML files for SQL models
        run: |
          echo "Verifica presenza dei file yml per ciascun modello sql"
          MISSING_YML=0

          for sql_file in $(find models -type f -name "*.sql"); do
            base_path="${sql_file%.sql}"
            if [[ ! -f "${base_path}.yml" ]]; then 
              echo "::error file=${sql_file}::il modello non possiede il rispettivo file yml (${base_path}.yml)"
              MISSING_YML=1
            fi
          done

          if [[ $MISSING_YML -eq 1 ]]; then
            echo "::error::uno o più file yml risultano mancanti, arresto della pipeline"
            exit 1
          fi
          echo "ok: tutti i file sql hanno il rispettivo file yml"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install dbt-databricks databricks-sdk requests

      - name: Set Dynamic Environment Variables
        run: |
          TARGET_BRANCH="${{ github.base_ref }}"
          PR_NUM="${{ github.event.number }}"

          # Aggiungiamo PR_NUM alle variabili d'ambiente del workflow
          echo "PR_NUM=${PR_NUM}" >> $GITHUB_ENV

          if [[ "$TARGET_BRANCH" == "main" ]]; then
            echo "PR verso main: attivazione QA temporaneo (clone di PROD)"
            echo "TEMP_CATALOG=qa_pr_${PR_NUM}" >> $GITHUB_ENV
            echo "DBT_TARGET=qa" >> $GITHUB_ENV
            echo "IS_RELEASE_PR=true" >> $GITHUB_ENV
          else
            echo "PR verso release: attivazione TST temporaneo"
            echo "TEMP_CATALOG=tst_pr_${PR_NUM}" >> $GITHUB_ENV
            echo "DBT_TARGET=tst" >> $GITHUB_ENV
            echo "IS_RELEASE_PR=false" >> $GITHUB_ENV
          fi

      - name: Generate profiles.yml
        run: |
          cat <<EOF > profiles.yml
          pipeline_on_databricks:
            target: "${DBT_TARGET}"
            outputs:
              tst:
                type: databricks
                host: "${DATABRICKS_HOST}"
                http_path: "${DATABRICKS_HTTP_PATH}"
                auth_type: token
                token: "${DATABRICKS_TOKEN}"
                catalog: "${TEMP_CATALOG}"
                schema: "main"
                threads: 4
              qa:
                type: databricks
                host: "${DATABRICKS_HOST}"
                http_path: "${DATABRICKS_HTTP_PATH}"
                auth_type: token
                token: "${DATABRICKS_TOKEN}"
                catalog: "${TEMP_CATALOG}"
                schema: "main"
                threads: 4
          EOF

      - name: Create Temporary Catalog (TST o QA)
        run: |
          python macros/temp_catalog.py --action create --catalog ${{ env.TEMP_CATALOG }}
      
      - name: Download Target Manifest & Install Deps
        run: |
          python macros/get_last_manifest.py
          dbt deps --profiles-dir .

      - name: Clone prod into temp QA (Solo per PR verso main)
        if: env.IS_RELEASE_PR == 'true'
        run: |
          echo "Clonazione di PROD (workspace_prd) nel catalogo temporaneo ${{ env.TEMP_CATALOG }}"
          dbt run-operation clone_environment \
            --args '{"source_catalog": "workspace_prd", "target_catalog": "${{ env.TEMP_CATALOG }}"}' \
            --profiles-dir . \
            --target qa

      - name: Run dbt Build (Two-Phase Execution)
        run: |
          if [ -f "./target_remote/manifest.json" ]; then

            if [ "${{ env.DBT_TARGET }}" == "tst" ]; then

              # 1. Clone delle tabelle incrementali in TST
              dbt clone \
                --target ${{ env.DBT_TARGET }} \
                --state ./target_remote \
                --profiles-dir . \
                --selector models_to_clone_to_tst \
                --exclude leaning_dummy_model+

              # 2. Full-refresh dei modelli incrementali modificati in TST
              dbt build \
                --target ${{ env.DBT_TARGET }} \
                --fail-fast \
                --defer \
                --full-refresh \
                --state ./target_remote \
                --profiles-dir . \
                --selector modified_incrementals \
                --exclude leaning_dummy_model+

            elif [ "${{ env.DBT_TARGET }}" == "qa" ]; then

              # 1. Build dei modelli incrementali modificati in QA
              dbt build \
                --target ${{ env.DBT_TARGET }} \
                --fail-fast \
                --defer \
                --state ./target_remote \
                --profiles-dir . \
                --selector modified_incrementals \
                --exclude leaning_dummy_model+

            fi

            # Seconda fase comune per TST e QA: Build di state:modified+
            echo "second phase"
            dbt build \
              --target ${{ env.DBT_TARGET }} \
              --fail-fast \
              --defer \
              --state ./target_remote \
              --profiles-dir . \
              --select state:modified+ \
              --exclude leaning_dummy_model+

          else
            echo "Manifest remoto non trovato: esecuzione build completa"
            dbt build \
              --target ${{ env.DBT_TARGET }} \
              --fail-fast \
              --profiles-dir . \
              --exclude leaning_dummy_model+
          fi

      # Copia del catalogo temporaneo qa_pr_<NUM> nel catalogo qa permanente condiviso
      - name: Merge Temporary Catalog into QA Target
        if: env.IS_RELEASE_PR == 'true'
        run: |
          echo "Clonazione da ${{ env.TEMP_CATALOG }} verso il catalogo condiviso 'qa'..."
          dbt run-operation switch_to_target \
            --args '{"source_catalog": "${{ env.TEMP_CATALOG }}", "target_catalog": "qa"}' \
            --profiles-dir . \
            --target qa

      # Cancellazione immediata del catalogo QA temporaneo
      - name: Drop Temporary QA Catalog
        if: always() && env.IS_RELEASE_PR == 'true'
        run: |
          echo "Cancellazione catalogo temporaneo ${{ env.TEMP_CATALOG }} a fine step"
          python macros/temp_catalog.py --action drop --catalog ${{ env.TEMP_CATALOG }} || true

  # Job di pulizia che rimane attivo per il cleanup di tst_pr_<NUM> alla chiusura/merge
  cleanup-temp-catalog:
    name: Drop Temporary Catalog on PR Close/Merge
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DBT_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      PR_NUM: ${{ github.event.number }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Databricks SDK
        run: pip install databricks-sdk

      - name: Drop Ephemeral Catalogs
        run: |
          PR_NUM="${{ github.event.number }}"
          echo "PR #${PR_NUM} chiusa. Eliminazione cataloghi temporanei rimanenti"
          python macros/temp_catalog.py --action drop --catalog "tst_pr_${PR_NUM}" || true
          python macros/temp_catalog.py --action drop --catalog "qa_pr_${PR_NUM}" || true