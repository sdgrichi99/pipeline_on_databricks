name: Databricks dbt CD Pipeline

on:
  push:
    branches:
      - main # Si attiva solo al Merge su main

jobs:
  dbt-cd-deploy-prod:
    name: Deploy to Production (workspace_prd)
    runs-on: ubuntu-latest

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DBT_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-databricks databricks-sdk requests

      - name: Generate profiles.yml
        run: |
          cat <<EOF > profiles.yml
          pipeline_on_databricks:
            target: "prd"
            outputs:
              prd:
                type: databricks
                host: "${DATABRICKS_HOST}"
                http_path: "${DATABRICKS_HTTP_PATH}"
                auth_type: token
                token: "${DATABRICKS_TOKEN}"
                catalog: workspace_prd
                schema: main
                threads: 4
          EOF

      - name: Install dbt Dependencies
        run: dbt deps --profiles-dir .

      - name: Run dbt Build in Production
        run: |
          echo "Esecuzione dbt build sul catalogo di Produzione (workspace_prd)..."
          dbt build --target prd --profiles-dir . --exclude leaning_dummy_model+

      - name: Upload Manifest to Databricks Volume
        if: success()
        run: |
          python macros/upload_manifest.py