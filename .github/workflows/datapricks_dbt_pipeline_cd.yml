name: Databricks dbt CD Pipeline

on:
  push:
    branches:
      - main
      - release
      - release/*

jobs:
  dbt-cd-deploy:
    name: Run dbt Build & Update Manifest Artifact
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del codice appena unito su main
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Installazione Dipendenze
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install dbt-databricks databricks-sdk

      # 4. Configurazione Variabili d'Ambiente Produzione
      - name: Set Target Environment Variables
        run: |
          echo "DATABRICKS_HOST=${{ secrets.DATABRICKS_HOST }}" >> $GITHUB_ENV
          echo "DATABRICKS_HTTP_PATH=${{ secrets.DBT_HTTP_PATH }}" >> $GITHUB_ENV
          echo "DATABRICKS_TOKEN=${{ secrets.DATABRICKS_TOKEN }}" >> $GITHUB_ENV
          echo "DBT_TARGET=prd" >> $GITHUB_ENV

      # 5. Generazione profiles.yml per Produzione
      - name: Generate profiles.yml
        run: |
          cat <<EOF > profiles.yml
          pipeline_on_databricks:
            target: "${{ env.DBT_TARGET }}"
            outputs:
              prd:
                type: databricks
                host: "${{ env.DATABRICKS_HOST }}"
                http_path: "${{ env.DATABRICKS_HTTP_PATH }}"
                auth_type: token
                token: "${{ env.DATABRICKS_TOKEN }}"
                catalog: workspace_prd
                schema: main
                threads: 4
          EOF

      # 6. Installazione pacchetti dbt
      - name: Install dbt Dependencies
        run: |
          dbt deps --profiles-dir .

      # 7. Esecuzione 'dbt build' in Produzione (Crea/Aggiorna Tabelle e Viste)
      - name: Run dbt Build on Production
        run: |
          dbt build --profiles-dir .

      # 8. Upload del nuovo manifest.json su Databricks Volume
      - name: Upload Manifest to Databricks Volume
        run: |
          python macros/upload_manifest.py